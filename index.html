<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Solar System</title>
  <meta name="description" content="An interactive 3D solar system built with Three.js." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="bg"></canvas>

  <!-- Top bar: title + controls -->
  <header class="hud-header">
    <span class="hud-title">☀ Solar System</span>
    <div class="hud-controls">
      <button id="btn-pause" class="ctrl-btn">Pause</button>
      <label class="speed-wrap">
        Speed
        <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1" />
        <span id="speed-val">1×</span>
      </label>
      <button id="btn-orbits" class="ctrl-btn">Orbits: on</button>
      <button id="btn-labels" class="ctrl-btn">Labels: on</button>
      <button id="btn-reset" class="ctrl-btn">Reset view</button>
    </div>
  </header>

  <!-- Planet info — plain text, top-right -->
  <aside id="info-panel" class="info-panel hidden">
    <button id="info-close" class="info-close">✕ close</button>
    <p id="info-name" class="info-name"></p>
    <p id="info-type" class="info-type"></p>
    <div id="info-stats" class="info-stats"></div>
    <p id="info-desc" class="info-desc"></p>
  </aside>

  <!-- Tooltip -->
  <div id="tooltip" class="tooltip hidden"></div>

  <!-- Bottom hint -->
  <p class="instructions">Drag to rotate · Scroll to zoom · Click a planet for info</p>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
